<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Several photos in one send</title>
  <desc id="d">Two photos of the same receipt are combined into one card, and a photo of a different purchase gets its own card. A bill and a card slip sent together stay as two cards, and Plenee asks whether they are the same purchase.</desc>
  <rect width="760" height="450" rx="14" fill="#FFFFFF" stroke="#DDE8F0"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0A8A9E"/></marker></defs>
  <text x="28" y="34" font-size="12" fill="#8A9EB0" letter-spacing="1.2">SEVERAL PHOTOS IN ONE SEND</text>

  <!-- left: photos -->
  <g stroke="#DDE8F0" stroke-width="2" fill="#F7FAFC">
    <rect x="28" y="62"  width="120" height="62" rx="8"/>
    <rect x="28" y="136" width="120" height="62" rx="8"/>
    <rect x="28" y="210" width="120" height="62" rx="8"/>
  </g>
  <g fill="#0C1929" font-size="13" font-weight="700">
    <text x="44" y="88">Photo 1</text><text x="44" y="162">Photo 2</text><text x="44" y="236">Photo 3</text>
  </g>
  <g fill="#4A5D70" font-size="12">
    <text x="44" y="106">Store A, top</text><text x="44" y="180">Store A, bottom</text><text x="44" y="254">Store B</text>
  </g>

  <!-- arrows -->
  <g stroke="#0A8A9E" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 93H236V106H300"/><path d="M150 167H236V122H300"/><path d="M150 241H300"/>
  </g>
  <text x="164" y="80" font-size="12" fill="#0A8A9E" font-weight="700">same receipt</text>

  <!-- right: cards -->
  <rect x="304" y="62"  width="428" height="76" rx="10" fill="#E6F7FA" stroke="#0FA8BC" stroke-width="2"/>
  <rect x="304" y="212" width="428" height="62" rx="10" fill="#FFFFFF" stroke="#0FA8BC" stroke-width="2"/>
  <g fill="#0C1929" font-size="15" font-weight="700"><text x="324" y="92">One card: Store A</text><text x="324" y="242">Its own card: Store B</text></g>
  <g fill="#4A5D70" font-size="12.5"><text x="324" y="114">Photos of the same purchase are combined</text><text x="324" y="260">A different purchase gets its own card</text></g>

  <!-- divider -->
  <line x1="28" y1="296" x2="732" y2="296" stroke="#DDE8F0" stroke-width="2"/>
  <text x="28" y="322" font-size="12" fill="#8A9EB0" letter-spacing="1.2">A BILL AND A CARD SLIP, SENT TOGETHER</text>

  <g stroke="#DDE8F0" stroke-width="2" fill="#F7FAFC"><rect x="28" y="346" width="120" height="62" rx="8"/><rect x="164" y="346" width="120" height="62" rx="8"/></g>
  <g fill="#0C1929" font-size="13" font-weight="700"><text x="44" y="372">Bill</text><text x="180" y="372">Card slip</text></g>
  <g fill="#4A5D70" font-size="12"><text x="44" y="390">Itemized</text><text x="180" y="390">Total only</text></g>

  <path d="M290 377H336" stroke="#0A8A9E" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="340" y="330" width="392" height="92" rx="10" fill="#FFFFFF" stroke="#0FA8BC" stroke-width="2"/>
  <text x="358" y="356" font-size="15" font-weight="700" fill="#0C1929">They stay two cards</text>
  <text x="358" y="376" font-size="13" fill="#4A5D70">Plenee asks "Same purchase?" and you answer:</text>
  <g>
    <rect x="358" y="386" width="130" height="26" rx="13" fill="#0A8A9E"/><text x="373" y="404" font-size="12.5" font-weight="700" fill="#FFFFFF">Same purchase</text>
    <rect x="500" y="386" width="196" height="26" rx="13" fill="#FFFFFF" stroke="#0A8A9E" stroke-width="1.5"/><text x="516" y="404" font-size="12.5" font-weight="700" fill="#0A8A9E">Two separate purchases</text>
  </g>
</svg>
